name: eduplatform

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: eduplatform-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eduplatform}
      POSTGRES_USER: ${POSTGRES_USER:-eduplatform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev}
      # Deterministic collation so ORDER BY behaves the same on every machine.
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=bg-BG --encoding=UTF8"
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Runs only on first initialisation of the volume.
      - ./deploy/docker/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eduplatform} -d ${POSTGRES_DB:-eduplatform}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:8-alpine
    container_name: eduplatform-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: eduplatform-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # One-shot job: creates the buckets the application expects, then exits.
  minio-init:
    image: minio/mc:latest
    container_name: eduplatform-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/materials &&
      mc mb --ignore-existing local/submissions &&
      mc mb --ignore-existing local/avatars &&
      mc mb --ignore-existing local/exports &&
      echo 'Buckets ready.'
      "
    restart: "no"

  mailpit:
    image: axllent/mailpit:latest
    container_name: eduplatform-mailpit
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

  seq:
    image: datalust/seq:latest
    container_name: eduplatform-seq
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      # Local log viewer on the developer's own machine — recent Seq versions refuse to
      # start unless authentication is configured either way, so opt out explicitly.
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      - "${SEQ_UI_PORT:-5341}:80"
      - "${SEQ_INGESTION_PORT:-5342}:5341"
    volumes:
      - seq-data:/data

  # Text embeddings for RAG. Not started by default — it pulls a ~2 GB model.
  # Enable from Phase 8 with:  docker compose --profile ai up -d
  embeddings:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8
    container_name: eduplatform-embeddings
    profiles: ["ai"]
    restart: unless-stopped
    command: ["--model-id", "BAAI/bge-m3", "--port", "80"]
    ports:
      - "${EMBEDDINGS_PORT:-8080}:80"
    volumes:
      - embeddings-cache:/data

volumes:
  postgres-data:
  redis-data:
  minio-data:
  seq-data:
  embeddings-cache:
