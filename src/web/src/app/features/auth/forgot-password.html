<div class="shell ep-card">
  @if (done()) {
    <h1>Проверете пощата си</h1>
    <p class="subtitle ep-muted">
      Ако има акаунт с този адрес, изпратихме връзка за задаване на нова парола.
      Тя е валидна два часа.
    </p>
    <div class="links">
      <a routerLink="/auth/login">Към входа</a>
    </div>
  } @else {
    <h1>Забравена парола</h1>
    <p class="subtitle ep-muted">Ще ви изпратим връзка за задаване на нова.</p>

    @if (error(); as message) {
      <p class="ep-alert is-error" role="alert">{{ message }}</p>
    }

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="ep-field">
        <label for="email">Електронна поща</label>
        <input id="email" type="email" formControlName="email" autocomplete="username" />
      </div>

      <div class="actions">
        <button class="ep-button" type="submit" [disabled]="busy()">
          {{ busy() ? 'Изпращане…' : 'Изпращане на връзка' }}
        </button>
      </div>
    </form>

    <div class="links">
      <a routerLink="/auth/login">Обратно към входа</a>
    </div>
  }
</div>
